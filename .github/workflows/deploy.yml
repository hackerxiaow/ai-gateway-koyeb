name: Deploy to Koyeb

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install Koyeb CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh
          echo "$HOME/.koyeb/bin" >> $GITHUB_PATH

      - name: Trigger Koyeb Redeploy
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
        run: |
          if [ -z "$KOYEB_TOKEN" ]; then
            echo "::error::KOYEB_TOKEN secret is not set"
            exit 1
          fi
          koyeb service redeploy api/ai-gateway --token "$KOYEB_TOKEN"
